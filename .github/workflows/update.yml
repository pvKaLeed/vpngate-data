name: Auto Update PublicVPN Data

on:
  schedule:
    - cron: '0 0 * * *' # ၁ ရက်လျှင် ၁ ကြိမ် အလိုအလျောက် Sync လုပ်မည်
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python fetch_publicvpn.py

      - name: Push CSV to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vpngate.csv
          git commit -m "Auto-update PublicVPN CSV Data [skip ci]" || exit 0
          git push
